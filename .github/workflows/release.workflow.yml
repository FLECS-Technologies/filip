name: Release

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip pushing images and version bump)'
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  determine-version-tags:
    name: Determine version tags
    runs-on: ubuntu-24.04
    outputs:
      version-list: ${{ steps.parse-cargo-versions.outputs.version-list }}
    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Parse Cargo.toml
        id: parse-cargo-versions
        run: |
          cd entrypoint
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')
          MAJOR_VERSION=$(printf '%s\n' "$VERSION" | cut -d. -f1)
          MINOR_VERSION=$(printf '%s\n' "$VERSION" | cut -d. -f1,2)
          set -- "$MAJOR_VERSION" "$MINOR_VERSION" "$VERSION" \
                 "v${MAJOR_VERSION}" "v${MINOR_VERSION}" "v${VERSION}"
          printf 'version-list=%s\n' "$(IFS=,; printf '%s' "$*")" >>"$GITHUB_OUTPUT"

  build-and-push:
    name: Build and push latest ${{ github.event.release.prerelease && '(dry-run)' || '' }}
    needs: determine-version-tags
    # Remove runs-on, as soon as workflow expansion is supported by codeberg
    runs-on: ubuntu-24.04
    if: success()
    uses: ./.github/workflows/build-and-push.yml
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || github.event.release.prerelease }}
      channel: latest
      versions: ${{ needs.determine-version-tags.outputs.version-list }}
    secrets: inherit

  bump-version:
    name: Bump version
    runs-on: ubuntu-24.04
    needs: build-and-push
    if: success()
    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install cargo-edit
        run: |
          cd ./entrypoint
          cargo install --locked cargo-edit

      - name: Bump patch version
        run: |
          cd ./entrypoint
          cargo set-version --bump patch

      - name: Commit version bump ${{ github.event.release.prerelease && '(dry-run)' || '' }})
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.codeberg.org"
          git add -- ./entrypoint/Cargo.{lock,toml}
          git commit -m "Auto-bump version after release"

      - name: Push version bump (Release)
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry-run) || github.event.release.prerelease == false }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git push origin "${DEFAULT_BRANCH}"

  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Upload Release assets
        uses: https://git.michaelsasser.org/actions/upload-release-assets@a3c4d716a7d72233debf6f1ce321e5c41eb7957c
        with:
          assets: |
            filip.sh
          create_sha256: "true"
          token: ${{ secrets.GH_REPO_WRITE }}
          tag: ${{ forgejo.ref_name }}
