name: Release
run-name: Release ${{ forgejo.ref_name }}

# Pushes the release images (<x>, <x>.<y>, <x>.<y>.<z>, each with and without a
# leading v, plus latest) for a published final release, bumps the patch version
# and attaches filip.sh to the release.
# Pre-releases are handled entirely by prerelease.workflow.yml, which also
# dry-runs this path so it is proven before the real tag exists.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    if: ${{ !forgejo.event.release.prerelease }}
    uses: ./.forgejo/workflows/verify-release.yml

  determine-version-tags:
    name: Determine version tags
    needs: verify
    # Repeated because Forgejo propagates only failure and cancellation through
    # needs: a skipped dependency counts as done and would let this job run.
    if: ${{ !forgejo.event.release.prerelease }}
    runs-on: ubuntu-24.04
    outputs:
      version-list: ${{ steps.version-list.outputs.version-list }}
    steps:
      - name: Derive version tags
        id: version-list
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          MAJOR_VERSION=$(printf '%s\n' "$VERSION" | cut -d. -f1)
          MINOR_VERSION=$(printf '%s\n' "$VERSION" | cut -d. -f1,2)
          set -- "$MAJOR_VERSION" "$MINOR_VERSION" "$VERSION" \
                 "v${MAJOR_VERSION}" "v${MINOR_VERSION}" "v${VERSION}"
          printf 'version-list=%s\n' "$(IFS=,; printf '%s' "$*")" >>"$FORGEJO_OUTPUT"

  build-and-push:
    name: Build and push latest
    needs: [verify, determine-version-tags]
    if: ${{ !forgejo.event.release.prerelease }}
    uses: ./.forgejo/workflows/build-and-push.yml
    with:
      channel: latest
      versions: ${{ needs.determine-version-tags.outputs.version-list }}
    secrets: inherit

  bump-version:
    name: Bump version
    runs-on: ubuntu-24.04
    needs: [verify, build-and-push]
    if: ${{ !forgejo.event.release.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ forgejo.event.repository.default_branch }}

      - name: Install cargo-edit
        run: |
          cd ./entrypoint
          cargo install --locked cargo-edit

      - name: Bump patch version
        run: |
          cd ./entrypoint
          cargo set-version --bump patch

      - name: Commit version bump
        run: |
          git config user.name "forgejo-actions[bot]"
          git config user.email "forgejo-actions[bot]@users.noreply.git.flecs.tech"
          git add -- ./entrypoint/Cargo.{lock,toml}
          git commit -m "Auto-bump version after release"

      - name: Push version bump
        env:
          DEFAULT_BRANCH: ${{ forgejo.event.repository.default_branch }}
        run: |
          git push origin "${DEFAULT_BRANCH}"

  release:
    name: Attach release assets
    runs-on: ubuntu-24.04
    needs: verify
    if: ${{ !forgejo.event.release.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Attach assets to release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ forgejo.event.release.id }}
          SERVER: ${{ forgejo.server_url }}
          REPO: ${{ forgejo.repository }}
        run: |
          set -eu
          sha256sum filip.sh | cut -d' ' -f1 >filip.sh.sha256
          for asset in filip.sh filip.sh.sha256; do
            curl -fS -X POST \
              -H "Authorization: token $TOKEN" \
              -F "attachment=@${asset}" \
              "${SERVER}/api/v1/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${asset}"
          done
