name: Bake

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      versions:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Determine git revision
        id: git-rev
        run: |
          echo "git-sha=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        # v3.7.0
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Setup Docker buildx
        # v3.12.0
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          platforms: linux/amd64,linux/arm64

      - name: Login to container registry
        # v3.7.0
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: flecspublic.azurecr.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_AUTH }}

      - name: Build ${{ inputs.dry-run == false && 'and push' || '' }} Docker image with VERSIONS
        if: inputs.versions != null && inputs.versions != ''
        # v6.10.0
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
        env:
          CHANNEL: ${{ inputs.channel }}
          GIT_SHA: ${{ steps.git-rev.outputs.git-sha }}
          VERSIONS: ${{ inputs.versions }}
        with:
          files: docker-bake.hcl
          pull: true
          push: ${{ inputs.dry-run == false }}

      - name: Build ${{ inputs.dry-run == false && 'and push' || '' }} Docker image without VERSIONS
        if: inputs.versions == null || inputs.versions == ''
        # v6.10.0
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4
        env:
          CHANNEL: ${{ inputs.channel }}
          GIT_SHA: ${{ steps.git-rev.outputs.git-sha }}
        with:
          files: docker-bake.hcl
          pull: true
          push: ${{ inputs.dry-run == false }}
