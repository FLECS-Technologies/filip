name: Bake

on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      versions:
        required: false
        type: string
      dry-run:
        required: false
        type: boolean
        default: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Determine git revision
        id: git-rev
        run: |
          echo "git-sha=$(git rev-parse --short HEAD)" >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - name: Login to container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: cr.flecs.tech
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_AUTH }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          platforms: linux/amd64,linux/arm64
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["cr.flecs.tech/dockerhub-proxy"]

      - name: Build ${{ inputs.dry-run == false && 'and push' || '' }} Docker image with VERSIONS
        if: inputs.versions != null && inputs.versions != ''
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          CHANNEL: ${{ inputs.channel }}
          GIT_SHA: ${{ steps.git-rev.outputs.git-sha }}
          VERSIONS: ${{ inputs.versions }}
        with:
          files: docker-bake.hcl
          pull: true
          push: ${{ inputs.dry-run == false }}

      - name: Build ${{ inputs.dry-run == false && 'and push' || '' }} Docker image without VERSIONS
        if: inputs.versions == null || inputs.versions == ''
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          CHANNEL: ${{ inputs.channel }}
          GIT_SHA: ${{ steps.git-rev.outputs.git-sha }}
        with:
          files: docker-bake.hcl
          pull: true
          push: ${{ inputs.dry-run == false }}
